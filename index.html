<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL Roster Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; color:#111827; margin:0; padding:24px; }
    .container { max-width:1400px; margin:0 auto; }
    h1 { margin:0 0 4px; }
    .subtitle { color:#6b7280; margin-bottom:20px; }
    .box,.card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .top { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    .value { font-size:26px; font-weight:bold; }
    .label { color:#6b7280; font-size:13px; }
    button,select,input { padding:10px; border-radius:8px; border:1px solid #d1d5db; font-size:14px; }
    button { background:#111827; color:#fff; cursor:pointer; font-weight:bold; border:none; }
    .controls { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:16px; }
    .teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
    .team { border:2px solid transparent; cursor:pointer; }
    .team:hover { border-color:#2563eb; }
    .team.selected { border-color:#111827; }
    .team-title { font-weight:bold; }
    .meta { color:#6b7280; font-size:12px; line-height:1.45; margin-top:6px; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:bold; background:#dcfce7; color:#16a34a; }
    .pill.error { background:#fee2e2; color:#dc2626; }
    .player { padding:8px 0; border-bottom:1px solid #e5e7eb; }
    .important { font-weight:bold; }
    .status { color:#6b7280; font-size:13px; margin-bottom:12px; }
    .errorText { color:#dc2626; font-weight:bold; }
    @media(max-width:900px){ .top,.grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>NFL Roster Monitor</h1>
    <div class="subtitle">Reads roster snapshots generated by GitHub Actions.</div>

    <div class="controls">
      <button onclick="loadDashboard()">Refresh dashboard</button>
      <select id="teamSelect" onchange="selectTeam(this.value)"></select>
      <input id="searchBox" placeholder="Search player..." oninput="renderSelectedTeam()" />
    </div>

    <div id="status" class="status">Loading...</div>

    <div class="top">
      <div class="card"><div id="teamsChecked" class="value">-</div><div class="label">Teams checked</div></div>
      <div class="card"><div id="teamsOk" class="value">-</div><div class="label">Teams OK</div></div>
      <div class="card"><div id="teamsErrored" class="value">-</div><div class="label">Teams errored</div></div>
      <div class="card"><div id="totalChanges" class="value">-</div><div class="label">Changes last run</div></div>
    </div>

    <div class="grid">
      <div class="box">
        <h2>Teams</h2>
        <div id="teams" class="teams"></div>
      </div>
      <div class="box">
        <h2 id="selectedTitle">Selected Team</h2>
        <div id="selectedTeam">Select a team.</div>
      </div>
    </div>
  </div>

<script>
const TEAMS = [
  ['ARI','Arizona Cardinals'], ['ATL','Atlanta Falcons'], ['BAL','Baltimore Ravens'], ['BUF','Buffalo Bills'],
  ['CAR','Carolina Panthers'], ['CHI','Chicago Bears'], ['CIN','Cincinnati Bengals'], ['CLE','Cleveland Browns'],
  ['DAL','Dallas Cowboys'], ['DEN','Denver Broncos'], ['DET','Detroit Lions'], ['GB','Green Bay Packers'],
  ['HOU','Houston Texans'], ['IND','Indianapolis Colts'], ['JAX','Jacksonville Jaguars'], ['KC','Kansas City Chiefs'],
  ['LV','Las Vegas Raiders'], ['LAC','Los Angeles Chargers'], ['LAR','Los Angeles Rams'], ['MIA','Miami Dolphins'],
  ['MIN','Minnesota Vikings'], ['NE','New England Patriots'], ['NO','New Orleans Saints'], ['NYG','New York Giants'],
  ['NYJ','New York Jets'], ['PHI','Philadelphia Eagles'], ['PIT','Pittsburgh Steelers'], ['SF','San Francisco 49ers'],
  ['SEA','Seattle Seahawks'], ['TB','Tampa Bay Buccaneers'], ['TEN','Tennessee Titans'], ['WAS','Washington Commanders']
].map(([code,name]) => ({code,name}));

let summary = null;
let statusRows = [];
let rosters = {};
let selectedCode = '';

function setStatus(msg, isError=false){
  document.getElementById('status').innerHTML = isError ? `<span class="errorText">${msg}</span>` : msg;
}

async function fetchJson(path){
  const res = await fetch(path + '?v=' + Date.now(), { cache:'no-store' });
  if(!res.ok) throw new Error(`${path} returned HTTP ${res.status}`);
  return await res.json();
}

async function loadDashboard(){
  setStatus('Loading dashboard data...');
  try {
    summary = await fetchJson('data/summary.json');
    statusRows = await fetchJson('data/status.json');

    rosters = {};
    for(const team of TEAMS){
      try {
        rosters[team.code] = await fetchJson(`data/latest/${team.code}.json`);
      } catch(e) {
        rosters[team.code] = { code:team.code, team:team.name, players:[], errors:[e.message] };
      }
    }

    renderSummary();
    renderTeams();
    renderTeamOptions();
    if(!selectedCode) selectedCode = 'BUF';
    document.getElementById('teamSelect').value = selectedCode;
    renderSelectedTeam();
    setStatus(`Loaded. Last run finished: ${summary.lastRunFinished || 'unknown'}`);
  } catch(e){
    setStatus('Dashboard load error: ' + e.message, true);
  }
}

function renderSummary(){
  document.getElementById('teamsChecked').textContent = summary.teamsChecked ?? '-';
  document.getElementById('teamsOk').textContent = summary.teamsOk ?? '-';
  document.getElementById('teamsErrored').textContent = summary.teamsErrored ?? '-';
  document.getElementById('totalChanges').textContent = summary.totalChanges ?? '-';
}

function getStatus(code){
  if(Array.isArray(statusRows)) return statusRows.find(x => x.teamCode === code || x.code === code) || {};
  return statusRows[code] || {};
}

function renderTeams(){
  const html = TEAMS.map(t => {
    const r = rosters[t.code] || {};
    const s = getStatus(t.code);
    const errors = (r.errors || []).length;
    const count = (r.players || []).length;
    return `<div class="card team ${selectedCode === t.code ? 'selected' : ''}" onclick="selectTeam('${t.code}')">
      <div class="team-title">${t.name}</div>
      <div class="meta">${t.code}</div>
      <div class="meta">Players: ${count}</div>
      <div class="meta">Checked: ${r.checkedAt || s.checkedAt || '-'}</div>
      <div class="meta"><span class="pill ${errors ? 'error' : ''}">${errors ? 'Source issue' : 'OK'}</span></div>
    </div>`;
  }).join('');
  document.getElementById('teams').innerHTML = html;
}

function renderTeamOptions(){
  document.getElementById('teamSelect').innerHTML = TEAMS.map(t => `<option value="${t.code}">${t.name}</option>`).join('');
}

function selectTeam(code){
  selectedCode = code;
  document.getElementById('teamSelect').value = code;
  renderTeams();
  renderSelectedTeam();
}

function renderSelectedTeam(){
  const roster = rosters[selectedCode];
  const team = TEAMS.find(t => t.code === selectedCode);
  if(!roster){ document.getElementById('selectedTeam').innerHTML = 'No team selected.'; return; }

  document.getElementById('selectedTitle').textContent = `${team.name} Roster`;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const players = (roster.players || []).filter(p => !q || String(p.name || '').toLowerCase().includes(q));
  const errors = (roster.errors || []).map(e => `<div class="errorText">${e}</div>`).join('');

  document.getElementById('selectedTeam').innerHTML = `
    <div class="meta">Source: ${roster.source || '-'}</div>
    <div class="meta">Players: ${(roster.players || []).length}</div>
    <div class="meta">Last checked: ${roster.checkedAt || '-'}</div>
    ${errors ? '<br>' + errors : ''}
    <br>
    ${players.length ? players.map(p => `<div class="player ${p.important ? 'important' : ''}">${p.name || ''} — ${p.position || '?'} — ${p.status || ''}<div class="meta">Source: NFL.com</div></div>`).join('') : '<div class="meta">No players found.</div>'}
  `;
}

loadDashboard();
setInterval(loadDashboard, 15 * 60 * 1000);
</script>
</body>
</html>
