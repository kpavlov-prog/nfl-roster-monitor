<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NFL Roster Monitor</title>

  <style>
    :root{
      --bg:#081226;
      --panel:#0f172a;
      --card:#ffffff;
      --line:#e5e7eb;
      --text:#111827;
      --muted:#64748b;
      --blue:#2563eb;
      --purple:#7c3aed;
      --green:#16a34a;
      --green-bg:#dcfce7;
      --red:#dc2626;
      --red-bg:#fee2e2;
      --yellow:#d97706;
      --yellow-bg:#fef3c7;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.28), transparent 32%),
        radial-gradient(circle at top right, rgba(124,58,237,.22), transparent 28%),
        var(--bg);
      color:white;
      min-height:100vh;
    }

    .container{
      max-width:1500px;
      margin:0 auto;
      padding:28px 24px 40px;
    }

    h1{
      margin:0;
      font-size:42px;
      letter-spacing:-0.04em;
    }

    .subtitle{
      margin-top:8px;
      color:#cbd5e1;
    }

    .controls{
      margin-top:24px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      padding:14px;
      border-radius:18px;
    }

    button,select,input{
      padding:11px 14px;
      border-radius:12px;
      border:none;
      font-size:14px;
    }

    button{
      background:linear-gradient(135deg,var(--blue),var(--purple));
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    input{ min-width:220px; }
    select{ min-width:220px; }

    .status{
      margin-top:14px;
      color:#dbeafe;
      font-size:14px;
    }

    .stats{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    .stat{
      background:white;
      color:var(--text);
      border-radius:18px;
      padding:18px;
      box-shadow:0 10px 25px rgba(0,0,0,.18);
      position:relative;
      overflow:hidden;
    }

    .stat:before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:5px;
      background:linear-gradient(90deg,var(--blue),var(--purple));
    }

    .stat-value{
      font-size:34px;
      font-weight:900;
    }

    .stat-label{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }

    .layout{
      margin-top:18px;
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
      align-items:start;
    }

    .panel{
      background:white;
      color:var(--text);
      border-radius:20px;
      padding:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
    }

    .panel + .panel{
      margin-top:18px;
    }

    .teams{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
      gap:12px;
    }

    .team{
      border:2px solid transparent;
      border-radius:16px;
      padding:14px;
      background:#f8fafc;
      cursor:pointer;
      transition:.12s ease;
    }

    .team:hover{
      transform:translateY(-2px);
      border-color:var(--blue);
    }

    .team.selected{
      border-color:var(--purple);
      background:#f5f3ff;
    }

    .team.has-change{
      border-color:var(--yellow);
    }

    .team-top{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .team-logo{
      width:46px;
      height:46px;
      object-fit:contain;
      flex-shrink:0;
    }

    .team-name{
      font-weight:900;
      font-size:15px;
    }

    .team-code{
      margin-top:4px;
      display:inline-block;
      background:#dbeafe;
      color:#1d4ed8;
      padding:3px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
    }

    .meta{
      margin-top:8px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .pill{
      display:inline-block;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      margin-top:6px;
    }

    .ok{
      background:var(--green-bg);
      color:var(--green);
    }

    .error{
      background:var(--red-bg);
      color:var(--red);
    }

    .warn{
      background:var(--yellow-bg);
      color:var(--yellow);
    }

    .player{
      padding:10px 0;
      border-bottom:1px solid var(--line);
    }

    .player.highlight{
      background:#fef3c7;
      margin:6px -8px;
      padding:10px 8px;
      border-radius:10px;
    }

    .player-name{
      font-weight:800;
    }

    .position{
      display:inline-block;
      margin-left:8px;
      background:#ede9fe;
      color:var(--purple);
      padding:2px 7px;
      border-radius:7px;
      font-size:12px;
      font-weight:900;
    }

    .status-pill{
      display:inline-block;
      margin-left:6px;
      padding:2px 7px;
      border-radius:7px;
      font-size:12px;
      font-weight:900;
      background:var(--green-bg);
      color:var(--green);
    }

    .status-danger{
      background:var(--red-bg);
      color:var(--red);
    }

    .status-warning{
      background:var(--yellow-bg);
      color:var(--yellow);
    }

    .change-item{
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      margin-bottom:10px;
      background:#f8fafc;
      cursor:pointer;
      transition:.12s ease;
    }

    .change-item:hover{
      border-color:var(--blue);
      transform:translateY(-1px);
    }

    .change-item.high{
      background:var(--red-bg);
    }

    .change-item.medium{
      background:var(--yellow-bg);
    }

    .change-title{
      font-weight:900;
    }

    .change-time{
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
    }

    .history-item{
      padding:10px 0;
      border-bottom:1px solid var(--line);
    }

    .history-main{
      font-weight:800;
    }

    .history-time{
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
    }

    .empty{
      color:var(--muted);
      font-style:italic;
    }

    @media(max-width:1050px){
      .stats,.layout{
        grid-template-columns:1fr;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <h1>NFL Roster Monitor</h1>

  <div class="subtitle">
    Official NFL roster monitoring dashboard powered by GitHub Actions.
  </div>

  <div class="controls">

    <button onclick="loadDashboard()">
      Refresh dashboard
    </button>

    <select id="teamSelect" onchange="selectTeam(this.value)">
    </select>

    <input
      id="searchBox"
      placeholder="Search player..."
      oninput="renderSelectedTeam()"
    />

  </div>

  <div id="status" class="status">
    Loading...
  </div>

  <div class="stats">

    <div class="stat">
      <div id="teamsChecked" class="stat-value">-</div>
      <div class="stat-label">Teams checked</div>
    </div>

    <div class="stat">
      <div id="teamsOk" class="stat-value">-</div>
      <div class="stat-label">Teams OK</div>
    </div>

    <div class="stat">
      <div id="teamsErrored" class="stat-value">-</div>
      <div class="stat-label">Teams errored</div>
    </div>

    <div class="stat">
      <div id="totalChanges" class="stat-value">-</div>
      <div class="stat-label">Changes detected</div>
    </div>

  </div>

</div>

<script>

function gmt(value){
  return new Date(value).toLocaleString(
    'en-GB',
    { timeZone:'UTC' }
  ) + ' GMT';
}

</script>

</body>
</html>
