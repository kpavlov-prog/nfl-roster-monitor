<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFL Roster Monitor</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#111827}.wrap{max-width:1200px;margin:auto}.card{background:white;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.team{border-left:6px solid #9ca3af}.team.err{border-left-color:#dc2626}.team.ok{border-left-color:#16a34a}.muted{color:#6b7280;font-size:13px}.change{border-left:6px solid #9ca3af;background:#f3f4f6;border-radius:8px;padding:10px;margin-bottom:8px}.high{border-left-color:#dc2626;background:#fee2e2;font-weight:bold}.medium{border-left-color:#d97706;background:#fef3c7;font-weight:bold}select,button{padding:10px;border-radius:8px;border:1px solid #d1d5db}button{background:#111827;color:white;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap}
  </style>
</head>
<body>
<div class="wrap">
  <h1>NFL Roster Monitor</h1>
  <p class="muted">Reads logs generated by GitHub Actions. Refresh this page after the Action runs.</p>
  <div class="card"><button onclick="loadAll()">Refresh dashboard</button> <select id="teamSelect" onchange="loadTeamLog()"></select></div>
  <div class="card"><h2>Run Summary</h2><pre id="summary">Loading...</pre></div>
  <div class="card"><h2>Teams</h2><div id="teams" class="grid"></div></div>
  <div class="card"><h2>Selected Team Log</h2><div id="teamLog" class="muted">Select a team.</div></div>
</div>
<script>
const teams=["ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN","DET","GB","HOU","IND","JAX","KC","LV","LAC","LAR","MIA","MIN","NE","NO","NYG","NYJ","PHI","PIT","SF","SEA","TB","TEN","WAS"];
document.getElementById('teamSelect').innerHTML='<option value="">Select team...</option>'+teams.map(t=>`<option>${t}</option>`).join('');
async function fetchJson(path){ const r=await fetch(path+'?v='+Date.now()); if(!r.ok) throw new Error(path); return r.json(); }
async function fetchText(path){ const r=await fetch(path+'?v='+Date.now()); if(!r.ok) return ''; return r.text(); }
async function loadAll(){
 try{
  const summary=await fetchJson('data/summary.json'); document.getElementById('summary').textContent=JSON.stringify(summary,null,2);
  const status=await fetchJson('data/status.json');
  document.getElementById('teams').innerHTML=teams.map(t=>{const s=status[t]||{};return `<div class="card team ${s.ok?'ok':'err'}"><b>${t}</b><br><span class="muted">${s.teamName||''}<br>Checked: ${s.checkedAt||'never'}<br>Players: ${s.playerCount||0}<br>Changes: ${s.changeCount||0}<br>${s.error||((s.errors||[]).join('<br>'))||''}</span></div>`}).join('');
 }catch(e){document.getElementById('summary').textContent='No data yet. Run the GitHub Action first.'}
}
function csvLineSplit(line){return line.match(/("[^"]*(""[^"]*)*"|[^,]+)/g)?.map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"'))||[]}
async function loadTeamLog(){
 const t=document.getElementById('teamSelect').value; if(!t){document.getElementById('teamLog').textContent='Select a team.';return}
 const txt=await fetchText(`data/team-logs/${t}.csv`); if(!txt){document.getElementById('teamLog').textContent='No logged changes for this team yet.';return}
 const lines=txt.trim().split('\n'); const header=csvLineSplit(lines.shift());
 const rows=lines.reverse().slice(0,100).map(line=>{const vals=csvLineSplit(line); const o={}; header.forEach((h,i)=>o[h]=vals[i]||''); return o});
 document.getElementById('teamLog').innerHTML=rows.map(r=>`<div class="change ${r.severity}">${r.timestamp} — ${r.severity?.toUpperCase()} — ${r.type}: ${r.playerName} (${r.position}) ${r.oldValue} → ${r.newValue}<br><span class="muted">${r.sourceStatus}</span></div>`).join('');
}
loadAll();
</script>
</body>
</html>
