name: NCAAF Roster Check

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: write

jobs:
  check-ncaaf-rosters:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests
      - name: Build FBS master list
        run: python scripts/build_ncaaf_fbs_master.py
      - name: Run NCAAF roster checker
        run: |
          python scripts/check_ncaaf_rosters.py

      - name: Commit NCAAF data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf logs/ncaaf
          git diff --cached --quiet || git commit -m "Update NCAAF roster data"
          git push
